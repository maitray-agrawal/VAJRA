<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VAJRA — Agentic Industrial Crisis Response</title>
    <meta name="description" content="VAJRA is an agentic industrial crisis-response system for telemetry-driven incident investigation, decision support, controlled response and auditable recovery." />
    <meta name="theme-color" content="#080A0D" />
    <meta property="og:title" content="VAJRA — Agentic Industrial Crisis Response" />
    <meta property="og:description" content="VAJRA is an agentic industrial crisis-response system for telemetry-driven incident investigation, decision support, controlled response and auditable recovery." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://vajra-astra.onrender.com/" />
    <meta name="robots" content="index, follow" />
    <!-- AstraX Typography System: Inter (Interface) + Fraunces (Display) + IBM Plex Mono (Technical) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Inline theme initializer to eliminate flash of unstyled theme (FOUC) -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('vajra-theme') || 'system';
          if (stored === 'dark') {
            document.documentElement.setAttribute('data-theme', 'dark');
          } else if (stored === 'light') {
            document.documentElement.setAttribute('data-theme', 'light');
          } else {
            document.documentElement.removeAttribute('data-theme');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
